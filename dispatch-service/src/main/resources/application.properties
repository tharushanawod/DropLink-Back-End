spring.application.name=dispatch-service

server.port=8081

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5434/droplink_dispatch_db
spring.datasource.username=dispatch_user
spring.datasource.password=${DISPATCH_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true