spring.application.name=account-service

server.port=8082

# Database connection
spring.datasource.url=jdbc:postgresql://127.0.0.1:5435/droplink_account_db
spring.datasource.username=account_user
spring.datasource.password=${ACCOUNT_DB_PASSWORD}


# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keycloak JWT configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/droplink

# Swagger UI configuration
springdoc.swagger-ui.path=/swagger-ui.html

# Keycloak OAuth2 configuration
springdoc.swagger-ui.oauth.client-id=droplink-swagger

# Enable PKCE for Authorization Code Flow
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true

# OAuth scopes
springdoc.swagger-ui.oauth.scopes=openid profile email

# s3 bucket configuration
app.storage.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.storage.s3.region=${S3_REGION:us-east-1}
app.storage.s3.bucket=${S3_BUCKET:droplink-driver-documents}
app.storage.s3.access-key=${RUSTFS_ACCESS_KEY}
app.storage.s3.secret-key=${RUSTFS_SECRET_KEY}

#file limitations
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

