spring.application.name=user-account-service

server.port=8082

# Database connection
spring.datasource.url=jdbc:postgresql://127.0.0.1:5435/droplink_user_account_db
spring.datasource.username=account_user
spring.datasource.password=${USER_ACCOUNT_DB_PASSWORD}


# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true