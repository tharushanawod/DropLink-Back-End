services:
  shipment-db:
    image: postgres:17
    container_name: droplink-shipment-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: droplink_shipment_db
      POSTGRES_USER: shipment_user
      POSTGRES_PASSWORD: ${SHIPMENT_DB_PASSWORD:?Set SHIPMENT_DB_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - shipment_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipment_user -d droplink_shipment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  shipment_db_data:
