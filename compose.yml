services:
  # SHIPMENT DATABASE
  shipment-db:
    image: postgres:17
    container_name: droplink-shipment-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: droplink_shipment_db
      POSTGRES_USER: shipment_user
      POSTGRES_PASSWORD: ${SHIPMENT_DB_PASSWORD:?Set SHIPMENT_DB_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - shipment_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipment_user -d droplink_shipment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DISPATCH DATABASE
  dispatch-db:
    image: postgres:17
    container_name: droplink-dispatch-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: droplink_dispatch_db
      POSTGRES_USER: dispatch_user
      POSTGRES_PASSWORD: ${DISPATCH_DB_PASSWORD:?Set DISPATCH_DB_PASSWORD in .env}

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - dispatch_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch_user -d droplink_dispatch_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  account-db:
    image: postgres:17
    container_name: droplink-account-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: droplink_account_db
      POSTGRES_USER: account_user
      POSTGRES_PASSWORD: ${ACCOUNT_DB_PASSWORD}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - account_db_data:/var/lib/postgresql/data

  rustfs:
    image: rustfs/rustfs:latest
    container_name: droplink-rustfs
    restart: unless-stopped

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error

    volumes:
      - rustfs_data:/data

    command: ["/data"]

volumes:
  shipment_db_data:
  dispatch_db_data:
  account_db_data:
  rustfs_data:
