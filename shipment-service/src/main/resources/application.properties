spring.application.name=shipment-service
server.port=8080

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5433/droplink_shipment_db
spring.datasource.username=shipment_user
spring.datasource.password=${SHIPMENT_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false
