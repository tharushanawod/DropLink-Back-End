spring.application.name=shipment-service
server.port=8080

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5433/droplink_shipment_db
spring.datasource.username=shipment_user
spring.datasource.password=${SHIPMENT_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Rabbitmq configurations
spring.rabbitmq.addresses=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.connection-timeout=5s